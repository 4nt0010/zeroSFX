<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>zeroSFX · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08070a;
    --card: #16131a;
    --card-2: #1d1922;
    --border: rgba(255,30,96,0.16);
    --border-strong: rgba(255,30,96,0.4);
    --accent: #FF1E60;
    --accent-bright: #ff5c8a;
    --text: #f2eef4;
    --text-muted: #9b95a3;
    --text-dim: #6b6472;
    --ok: #3ddc97;
    --warn: #ffb347;
    --display: 'Chakra Petch', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  body{
    background: var(--bg); color: var(--text); font-family: var(--body); line-height: 1.45; min-height: 100vh;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,30,96,0.06) 1px, transparent 0);
    background-size: 26px 26px;
  }
  body.locked{ overflow: hidden; }
  :focus-visible{ outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 4px; }
  button, input, select{ font: inherit; color: inherit; }

    .login{ position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); padding: 20px; }
  .login.hidden{ display: none; }
  .login-card{ width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 32px 28px; }
  .login-card h1{ font-family: var(--display); font-size: 24px; text-align: center; }
  .login-card p{ color: var(--text-muted); font-size: 13px; text-align: center; margin: 6px 0 22px; }
  .field{ margin-bottom: 14px; }
  .field label{ display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input{ width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); }
  .field input:focus{ outline: none; border-color: var(--border-strong); }
  .login-error{ color: var(--accent-bright); font-size: 13px; margin-bottom: 12px; min-height: 18px; }
  .btn-primary{ width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .btn-primary:disabled{ opacity: .6; cursor: wait; }

    .wrap{ max-width: 1280px; margin: 0 auto; padding: 0 24px 60px; }
  header{ display: flex; align-items: center; gap: 16px; padding: 26px 0 18px; }
  .brand{ display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 24px; }
  .brand img{ height: 34px; width: auto; display: block; filter: drop-shadow(0 0 12px rgba(255,30,96,0.35)); }
  .brand .brand-text{ display: none; }
  .brand.no-logo img{ display: none; }
  .brand.no-logo .brand-text{ display: inline; }
  .brand .brand-text span{ color: var(--accent-bright); }
  .brand small{ font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--text-dim); padding: 3px 8px; border: 1px solid var(--border); border-radius: 99px; }
  .brand-login{ justify-content: center; }
  .brand-login img{ height: 52px; }
  .who{ margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  .btn{ padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); cursor: pointer; font-size: 13px; }
  .btn:hover{ border-color: var(--border-strong); }

  .tabs{ display: flex; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab{ padding: 10px 16px; border: 0; background: none; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"]{ color: var(--text); border-bottom-color: var(--accent); }

  .cards{ display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; }
  .card .k{ font-size: 12px; color: var(--text-muted); }
  .card .v{ font-family: var(--display); font-size: 26px; font-weight: 700; margin-top: 2px; }
  .card .v.live{ color: var(--ok); }

  .filters{ display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .filters label{ display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .filters input, .filters select{ padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); min-width: 130px; font-size: 13px; }
  .filters input[type="search"]{ min-width: 190px; }
  .filters .spacer{ flex: 1; }

  .table-wrap{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: auto; }
  table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td{ text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); white-space: nowrap; }
  th{ position: sticky; top: 0; background: var(--card-2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 600; }
  tbody tr{ cursor: pointer; }
  tbody tr:hover{ background: rgba(255,30,96,0.06); }
  tbody tr.sel{ background: rgba(255,30,96,0.12); }
  td.num, th.num{ text-align: right; font-family: var(--mono); }
  td.mono{ font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .empty{ padding: 40px; text-align: center; color: var(--text-dim); font-family: var(--mono); font-size: 13px; }
  .count{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin: 8px 2px 0; }

  .badge{ display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; border: 1px solid var(--border); }
  .badge .dot{ width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.live{ color: var(--ok); border-color: rgba(61,220,151,.35); }
  .badge.live .dot{ animation: pulse 1.6s infinite; }
  .badge.logout{ color: var(--text-muted); }
  .badge.timeout{ color: var(--warn); border-color: rgba(255,179,71,.3); }
  .badge.idle{ color: var(--text-dim); }
  .cont{ color: var(--accent-bright); margin-right: 4px; }
  @keyframes pulse{ 50%{ opacity: .3; } }

    .drawer{ position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--card); border-left: 1px solid var(--border-strong); z-index: 20; padding: 22px; overflow: auto; transform: translateX(100%); transition: transform .2s ease; }
  .drawer.open{ transform: none; }
  .drawer h2{ font-family: var(--display); font-size: 18px; margin-bottom: 14px; display: flex; align-items: center; }
  .drawer h2 .btn{ margin-left: auto; }
  .kv{ display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv dt{ color: var(--text-muted); }
  .kv dd{ word-break: break-word; font-family: var(--mono); font-size: 12px; }
  .kv dd a{ color: var(--accent-bright); cursor: pointer; text-decoration: underline; }

  .denied{ display: none; text-align: center; padding: 120px 20px; }
  .denied h2{ font-family: var(--display); font-size: 22px; margin-bottom: 8px; }
  .denied p{ color: var(--text-muted); margin-bottom: 18px; }
  .loading{ text-align: center; padding: 140px 20px; color: var(--text-dim); font-family: var(--mono); font-size: 13px; }
  .hidden{ display: none !important; }
</style>
</head>
<body class="locked">

<div class="login" id="login">
  <div class="login-card">
    <h1 class="brand brand-login"><img src="https://firebasestorage.googleapis.com/v0/b/zerosfx-a74aa.firebasestorage.app/o/Logo.svg?alt=media&amp;token=53b40bb9-adec-43e1-8b14-0aad12bb729b" alt="zeroSFX" onerror="this.parentNode.classList.add('no-logo')"><span class="brand-text">zeroSFX</span></h1>
    <p>Area riservata</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginUser">Utente</label>
        <input id="loginUser" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="loginError" role="alert"></div>
      <button class="btn-primary" type="submit" id="loginBtn">Accedi</button>
    </form>
  </div>
</div>

<div class="loading hidden" id="loading">Caricamento…</div>

<div class="denied" id="denied">
  <h2>Accesso negato</h2>
  <p>Questo account non ha i permessi di amministratore.</p>
  <button class="btn" id="deniedBack">Torna al login</button>
</div>

<div class="wrap hidden" id="app">
  <header>
    <h1 class="brand"><img src="https://firebasestorage.googleapis.com/v0/b/zerosfx-a74aa.firebasestorage.app/o/Logo.svg?alt=media&amp;token=53b40bb9-adec-43e1-8b14-0aad12bb729b" alt="zeroSFX" onerror="this.parentNode.classList.add('no-logo')"><span class="brand-text">zero<span>SFX</span></span><small>Admin</small></h1>
    <span class="who" id="who"></span>
    <button class="btn" id="logoutBtn">Esci</button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="sessioni" aria-selected="true">Sessioni</button>
    <button class="tab" role="tab" data-tab="utenti" aria-selected="false">Utenti</button>
    <button class="tab" role="tab" data-tab="storico" aria-selected="false">Storico accessi</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="filters" id="filters">
    <label>Dal <input type="date" id="fFrom"></label>
    <label>Al <input type="date" id="fTo"></label>
    <label class="f-sess">Utente <select id="fUser"><option value="">Tutti</option></select></label>
    <label class="f-sess">Paese <select id="fCountry"><option value="">Tutti</option></select></label>
    <label class="f-sess">Dispositivo <select id="fDevice"><option value="">Tutti</option></select></label>
    <label class="f-sess f-only-sess">Stato
      <select id="fState">
        <option value="">Tutti</option>
        <option value="live">In corso</option>
        <option value="logout">Logout</option>
        <option value="timeout">Timeout</option>
        <option value="idle">In chiusura</option>
      </select>
    </label>
    <label>Cerca <input type="search" id="fSearch" placeholder="IP, città, browser…"></label>
    <span class="spacer"></span>
    <button class="btn" id="csvBtn">Esporta CSV</button>
  </div>

  <div class="table-wrap"><table id="table"></table></div>
  <div class="count" id="count"></div>
</div>

<aside class="drawer" id="drawer" aria-label="Dettaglio sessione">
  <h2><span id="drawerTitle">Dettaglio</span><button class="btn" id="drawerClose">Chiudi</button></h2>
  <dl class="kv" id="drawerBody"></dl>
</aside>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, getDocs, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { initializeAuth, inMemoryPersistence, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsU6kgVyVBQC5VEzTv7P7orZlbRUD3q84",
    authDomain: "zerosfx-a74aa.firebaseapp.com",
    projectId: "zerosfx-a74aa",
    storageBucket: "zerosfx-a74aa.firebasestorage.app",
    messagingSenderId: "1043982800334",
    appId: "1:1043982800334:web:11a9df6f2b23b0e3b0c79f"
  };
  const LOGIN_DOMAIN = 'zerosfx.app';
  const LIVE_MS = 150 * 1000;
  const MAX_SESSIONI = 3000;

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = initializeAuth(app, { persistence: inMemoryPersistence });

  const $ = (id) => document.getElementById(id);

  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = $('loginUser').value.trim().toLowerCase();
    const email = u.includes('@') ? u : `${u}@${LOGIN_DOMAIN}`;
    $('loginBtn').disabled = true;
    $('loginError').textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, $('loginPass').value);
    } catch (err) {
      $('loginError').textContent = err && err.code === 'auth/too-many-requests'
        ? 'Troppi tentativi. Riprova tra qualche minuto.' : 'Credenziali non valide.';
      $('loginPass').value = '';
    } finally { $('loginBtn').disabled = false; }
  });
  $('logoutBtn').addEventListener('click', () => signOut(auth));
  $('deniedBack').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    stopLive();
    if (!user) {
      $('app').classList.add('hidden'); $('loading').classList.add('hidden'); $('denied').style.display = 'none';
      $('login').classList.remove('hidden'); document.body.classList.add('locked');
      $('loginPass').value = ''; setTimeout(() => $('loginUser').focus(), 50);
      return;
    }
    $('login').classList.add('hidden'); document.body.classList.remove('locked');
    $('app').classList.add('hidden');
    if ((user.email || '').toLowerCase() !== `admin@${LOGIN_DOMAIN}`) { showDenied(); return; }
    $('who').textContent = user.email;
    $('loading').classList.remove('hidden');
    startLive();
  });

  function showDenied() {
    stopLive();
    $('app').classList.add('hidden'); $('loading').classList.add('hidden');
    $('denied').style.display = 'block';
  }

  let tab = 'sessioni';
  let sessioni = [];
  let storico = null;
  let unsub = null;
  let tick = null;
  let selectedId = null;

  const dayStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  (function initDates() {
    const to = new Date(); const from = new Date(); from.setDate(from.getDate() - 6);
    $('fFrom').value = dayStr(from); $('fTo').value = dayStr(to);
  })();
  function range() {
    const from = new Date($('fFrom').value + 'T00:00:00');
    const to = new Date($('fTo').value + 'T00:00:00'); to.setDate(to.getDate() + 1);
    return { from, to };
  }

  function startLive() {
    stopLive();
    const { from, to } = range();
    const q = query(collection(db, 'sessioni'),
      where('startedAt', '>=', Timestamp.fromDate(from)),
      where('startedAt', '<', Timestamp.fromDate(to)),
      orderBy('startedAt', 'desc'), limit(MAX_SESSIONI));
    unsub = onSnapshot(q, (snap) => {
      sessioni = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      $('loading').classList.add('hidden');
      $('app').classList.remove('hidden');
      fillSelects();
      render();
    }, (err) => {
      if (err && err.code === 'permission-denied') { showDenied(); return; }
      $('loading').classList.add('hidden'); $('app').classList.remove('hidden');
      console.error(err); $('table').innerHTML = `<tr><td class="empty">Errore di lettura: ${esc(err.code || err.message)}</td></tr>`; });
    tick = setInterval(() => { if (tab !== 'storico') render(); }, 15000);
  }
  function stopLive() {
    if (unsub) { unsub(); unsub = null; }
    if (tick) { clearInterval(tick); tick = null; }
  }

  async function loadStorico() {
    $('table').innerHTML = '<tr><td class="empty">Caricamento…</td></tr>';
    const { from, to } = range();
    const snap = await getDocs(query(collection(db, 'accessi'),
      where('at', '>=', Timestamp.fromDate(from)), where('at', '<', Timestamp.fromDate(to)),
      orderBy('at', 'desc'), limit(MAX_SESSIONI)));
    storico = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  }

  const ms = (t) => (t && t.toMillis ? t.toMillis() : null);
  function stato(s) {
    if (s.endReason === 'logout') return 'logout';
    if (s.endReason === 'timeout') return 'timeout';
    return Date.now() - (ms(s.lastSeenAt) || 0) < LIVE_MS ? 'live' : 'idle';
  }
  function durata(s) {
    if (s.durataSec != null) return s.durataSec;
    const start = ms(s.startedAt); if (!start) return 0;
    const end = ms(s.endedAt) || (stato(s) === 'live' ? Date.now() : ms(s.lastSeenAt)) || start;
    return Math.max(0, Math.round((end - start) / 1000));
  }
  function fmtDur(sec) {
    sec = Math.round(sec || 0);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
    if (m) return `${m}m ${String(s).padStart(2, '0')}s`;
    return `${s}s`;
  }
  const fmtDate = (t) => { const v = ms(t); return v ? new Date(v).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; };
  const luogo = (s) => [s.citta, s.paese].filter(Boolean).join(', ') || '—';
  const STATO_LABEL = { live: 'In corso', logout: 'Logout', timeout: 'Timeout', idle: 'In chiusura' };
  const STATO_TIP = { idle: 'Nessun battito da qualche minuto: verrà segnata come timeout al prossimo controllo.' };

  function fillSelects() {
    const keep = (sel, values) => {
      const cur = sel.value;
      sel.innerHTML = '<option value="">Tutti</option>' + [...values].sort().map((v) => `<option>${esc(v)}</option>`).join('');
      sel.value = values.has(cur) ? cur : '';
    };
    keep($('fUser'), new Set(sessioni.map((s) => s.utente).filter(Boolean)));
    keep($('fCountry'), new Set(sessioni.map((s) => s.paese).filter(Boolean)));
    keep($('fDevice'), new Set(sessioni.map((s) => s.dispositivo).filter(Boolean)));
  }

  function filtered() {
    const u = $('fUser').value, c = $('fCountry').value, d = $('fDevice').value, st = $('fState').value;
    const q = $('fSearch').value.trim().toLowerCase();
    return sessioni.filter((s) =>
      (!u || s.utente === u) && (!c || s.paese === c) && (!d || s.dispositivo === d) && (!st || stato(s) === st) &&
      (!q || [s.ip, s.citta, s.regione, s.paese, s.isp, s.browser, s.os, s.utente].some((v) => String(v || '').toLowerCase().includes(q))));
  }

  function perUtente(list) {
    const m = new Map();
    for (const s of list) {
      const k = s.utente || s.uid;
      const r = m.get(k) || { utente: k, sessioni: 0, tot: 0, att: 0, ultimo: null, devices: new Set(), paesi: new Set(), live: false };
      r.sessioni++; r.tot += durata(s); r.att += s.attivaSec || 0;
      if (!r.ultimo || ms(s.startedAt) > ms(r.ultimo)) r.ultimo = s.startedAt;
      if (s.deviceToken) r.devices.add(s.deviceToken);
      if (s.paese) r.paesi.add(s.paese);
      if (stato(s) === 'live') r.live = true;
      m.set(k, r);
    }
    return [...m.values()].sort((a, b) => b.tot - a.tot);
  }

  function render() {
    document.querySelectorAll('.f-sess').forEach((el) => el.classList.toggle('hidden', tab === 'storico'));
    document.querySelectorAll('.f-only-sess').forEach((el) => el.classList.toggle('hidden', tab !== 'sessioni'));
    if (tab === 'storico') return renderStorico();

    const list = filtered();
    const live = list.filter((s) => stato(s) === 'live').length;
    const tot = list.reduce((a, s) => a + durata(s), 0);
    const att = list.reduce((a, s) => a + (s.attivaSec || 0), 0);
    const utenti = new Set(list.map((s) => s.utente || s.uid)).size;
    const n = list.length || 1;
    $('cards').innerHTML = [
      ['Online adesso', live, 'live'],
      ['Sessioni', list.length],
      ['Utenti diversi', utenti],
      ['Durata media', fmtDur(tot / n)],
      ['Tempo attivo medio', fmtDur(att / n)],
      ['Tempo totale', fmtDur(tot)],
    ].map(([k, v, cls]) => `<div class="card"><div class="k">${k}</div><div class="v ${cls || ''}">${esc(v)}</div></div>`).join('');

    if (tab === 'utenti') return renderUtenti(list);

    const rows = list.map((s) => {
      const st = stato(s);
      return `<tr data-id="${esc(s.id)}" class="${s.id === selectedId ? 'sel' : ''}">
        <td>${s.continuaDa ? '<span class="cont" title="Continua una sessione chiusa per timeout">↪</span>' : ''}${esc(s.utente || '—')}</td>
        <td class="mono">${fmtDate(s.startedAt)}</td>
        <td class="num">${fmtDur(durata(s))}</td>
        <td class="num">${fmtDur(s.attivaSec)}</td>
        <td><span class="badge ${st}" title="${esc(STATO_TIP[st] || '')}"><span class="dot"></span>${STATO_LABEL[st]}</span></td>
        <td>${esc(luogo(s))}</td>
        <td>${esc([s.dispositivo, s.os, s.browser].filter(Boolean).join(' · ') || '—')}</td>
        <td class="mono">${esc(s.ip || '—')}</td>
      </tr>`;
    }).join('');
    $('table').innerHTML = `<thead><tr><th>Utente</th><th>Inizio</th><th class="num">Durata</th><th class="num">Attiva</th><th>Stato</th><th>Luogo</th><th>Dispositivo</th><th>IP</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">Nessuna sessione in questo periodo.</td></tr>'}</tbody>`;
    $('count').textContent = `${list.length} sessioni${sessioni.length >= MAX_SESSIONI ? ` (limite di ${MAX_SESSIONI} raggiunto: restringi le date)` : ''}`;
    if (selectedId) { const s = sessioni.find((x) => x.id === selectedId); if (s) showDetail(s, false); }
  }

  function renderUtenti(list) {
    const rows = perUtente(list).map((r) => `<tr data-user="${esc(r.utente)}">
      <td>${r.live ? '<span class="badge live" title="Online adesso"><span class="dot"></span></span> ' : ''}${esc(r.utente)}</td>
      <td class="num">${r.sessioni}</td>
      <td class="num">${fmtDur(r.tot)}</td>
      <td class="num">${fmtDur(r.att)}</td>
      <td class="num">${fmtDur(r.tot / r.sessioni)}</td>
      <td class="mono">${fmtDate(r.ultimo)}</td>
      <td class="num">${r.devices.size}</td>
      <td>${esc([...r.paesi].join(', ') || '—')}</td>
    </tr>`).join('');
    $('table').innerHTML = `<thead><tr><th>Utente</th><th class="num">Sessioni</th><th class="num">Tempo totale</th><th class="num">Tempo attivo</th><th class="num">Durata media</th><th>Ultimo accesso</th><th class="num">Dispositivi</th><th>Paesi</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">Nessun utente in questo periodo.</td></tr>'}</tbody>`;
    $('count').textContent = 'Clicca un utente per vedere le sue sessioni.';
  }

  function renderStorico() {
    $('cards').innerHTML = '';
    if (!storico) { loadStorico().catch((err) => { $('table').innerHTML = `<tr><td class="empty">Errore: ${esc(err.code || err.message)}</td></tr>`; }); return; }
    const q = $('fSearch').value.trim().toLowerCase();
    const list = storico.filter((a) => !q || [a.email, a.ip, a.geo && a.geo.city, a.geo && a.geo.country, a.ua].some((v) => String(v || '').toLowerCase().includes(q)));
    const rows = list.map((a) => `<tr data-old="${esc(a.id)}">
      <td class="mono">${fmtDate(a.at)}</td>
      <td>${esc((a.email || '').replace('@' + LOGIN_DOMAIN, '') || '—')}</td>
      <td>${esc(a.geo ? [a.geo.city, a.geo.country].filter(Boolean).join(', ') : '—')}</td>
      <td class="mono">${esc(a.ip || '—')}</td>
      <td class="mono">${esc((a.ua || '').slice(0, 70))}</td>
    </tr>`).join('');
    $('table').innerHTML = `<thead><tr><th>Data</th><th>Utente</th><th>Luogo</th><th>IP</th><th>User agent</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="empty">Nessun accesso nel vecchio registro in questo periodo.</td></tr>'}</tbody>`;
    $('count').textContent = `${list.length} accessi (vecchio registro, senza durata)`;
  }

  function showDetail(s, open = true) {
    const st = stato(s);
    const rows = [
      ['Utente', s.utente], ['Email', s.email], ['Stato', STATO_LABEL[st]],
      ['Inizio', fmtDate(s.startedAt)], ['Ultimo battito', fmtDate(s.lastSeenAt)], ['Fine', fmtDate(s.endedAt)],
      ['Durata', fmtDur(durata(s))], ['Tempo attivo', fmtDur(s.attivaSec)],
      ['Continua da', s.continuaDa ? `<a data-goto="${esc(s.continuaDa)}">${esc(s.continuaDa)}</a>` : '—', true],
      ['IP', s.ip], ['Catena IP', (s.ipChain || []).join(' → ')],
      ['Luogo', [s.citta, s.regione, s.paese].filter(Boolean).join(', ')], ['Provider', s.isp],
      ['Fonte geo', s.geoSource], ['Errore geo', s.geoErrore],
      ['Dispositivo', s.dispositivo], ['Sistema', s.os], ['Browser', s.browser],
      ['Schermo', s.screen], ['Lingua', s.lang], ['Fuso orario', s.tz], ['Piattaforma', s.platform],
      ['ID dispositivo', s.deviceToken], ['User agent', s.ua], ['ID sessione', s.id],
    ];
    $('drawerTitle').textContent = s.utente || 'Sessione';
    $('drawerBody').innerHTML = rows.map(([k, v, html]) => `<dt>${k}</dt><dd>${html ? v : esc(v || '—')}</dd>`).join('');
    if (open) $('drawer').classList.add('open');
  }
  $('drawerClose').addEventListener('click', () => { $('drawer').classList.remove('open'); selectedId = null; render(); });
  $('drawerBody').addEventListener('click', (e) => {
    const id = e.target.dataset && e.target.dataset.goto; if (!id) return;
    const s = sessioni.find((x) => x.id === id);
    if (s) { selectedId = id; render(); showDetail(s); }
    else alert('La sessione precedente è fuori dal periodo selezionato.');
  });

  $('table').addEventListener('click', (e) => {
    const tr = e.target.closest('tbody tr'); if (!tr) return;
    if (tr.dataset.id) {
      selectedId = tr.dataset.id;
      const s = sessioni.find((x) => x.id === selectedId);
      render(); if (s) showDetail(s);
    } else if (tr.dataset.user) {
      $('fUser').value = tr.dataset.user; setTab('sessioni');
    } else if (tr.dataset.old) {
      const a = storico.find((x) => x.id === tr.dataset.old); if (!a) return;
      $('drawerTitle').textContent = 'Accesso (vecchio registro)';
      $('drawerBody').innerHTML = Object.entries({
        Data: fmtDate(a.at), Email: a.email, IP: a.ip, 'Catena IP': (a.ipChain || []).join(' → '),
        Luogo: a.geo ? [a.geo.city, a.geo.region, a.geo.country].filter(Boolean).join(', ') : '', Provider: a.geo && a.geo.org,
        'Errore geo': a.geoErrore, Schermo: a.screen, Lingua: a.lang, 'Fuso orario': a.tz, Piattaforma: a.platform,
        'ID dispositivo': a.deviceToken, 'User agent': a.ua,
      }).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v || '—')}</dd>`).join('');
      $('drawer').classList.add('open');
    }
  });

  function setTab(t) {
    tab = t;
    document.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    $('drawer').classList.remove('open'); selectedId = null;
    render();
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  ['fUser', 'fCountry', 'fDevice', 'fState'].forEach((id) => $(id).addEventListener('change', render));
  $('fSearch').addEventListener('input', render);
  ['fFrom', 'fTo'].forEach((id) => $(id).addEventListener('change', () => {
    if (!$('fFrom').value || !$('fTo').value) return;
    storico = null; startLive(); if (tab === 'storico') render();
  }));

  const cell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[";\n,]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const iso = (t) => { const v = ms(t); return v ? new Date(v).toLocaleString('sv-SE') : ''; };
  $('csvBtn').addEventListener('click', () => {
    let head, rows;
    if (tab === 'sessioni') {
      head = ['id', 'utente', 'giorno', 'inizio', 'ultimo_battito', 'fine', 'stato', 'durata_sec', 'attiva_sec', 'continua_da', 'ip', 'citta', 'regione', 'paese', 'isp', 'dispositivo', 'os', 'browser', 'schermo', 'lingua', 'fuso', 'id_dispositivo', 'user_agent'];
      rows = filtered().map((s) => [s.id, s.utente, s.giorno, iso(s.startedAt), iso(s.lastSeenAt), iso(s.endedAt), stato(s), durata(s), s.attivaSec || 0, s.continuaDa, s.ip, s.citta, s.regione, s.paese, s.isp, s.dispositivo, s.os, s.browser, s.screen, s.lang, s.tz, s.deviceToken, s.ua]);
    } else if (tab === 'utenti') {
      head = ['utente', 'sessioni', 'tempo_totale_sec', 'tempo_attivo_sec', 'durata_media_sec', 'ultimo_accesso', 'dispositivi', 'paesi'];
      rows = perUtente(filtered()).map((r) => [r.utente, r.sessioni, r.tot, r.att, Math.round(r.tot / r.sessioni), iso(r.ultimo), r.devices.size, [...r.paesi].join(' / ')]);
    } else {
      head = ['id', 'data', 'email', 'ip', 'citta', 'paese', 'isp', 'id_dispositivo', 'user_agent'];
      rows = (storico || []).map((a) => [a.id, iso(a.at), a.email, a.ip, a.geo && a.geo.city, a.geo && a.geo.country, a.geo && a.geo.org, a.deviceToken, a.ua]);
    }
    const csv = '﻿' + [head, ...rows].map((r) => r.map(cell).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `zerosfx-${tab}-${$('fFrom').value}_${$('fTo').value}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
</script>
</body>
</html>
